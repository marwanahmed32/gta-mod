<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marwan GTA V 1.27 Mod</title>
    <style>
        body { background-color: #0d0e12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .box { max-width: 500px; margin: 0 auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; }
        h1 { color: #58a6ff; font-size: 1.8rem; }
        input { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px; font-size: 1.1rem; border-radius: 6px; width: 80%; text-align: center; margin-bottom: 20px; }
        button { background: #238636; color: #fff; border: none; padding: 14px 28px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>مود GTA V (1.27) - السيارات الخمس</h1>
        <p>أدخل IP البلايستيشن واضغط تفعيل:</p>
        <input type="text" id="ip" placeholder="مثال: 192.168.1.15">
        <br>
        <button onclick="sendMod()">تفعيل المود 🚀</button>
        <div id="status"></div>
    </div>

    <script>
        function sendMod() {
            var ip = document.getElementById("ip").value.trim();
            var st = document.getElementById("status");
            
            var ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
            if(!ip || !ipRegex.test(ip)) { 
                st.style.color = "#f85149"; 
                st.innerText = "❌ أدخل عنوان IP صحيح!"; 
                return; 
            }
            
            st.style.color = "#e3b341";
            st.innerText = "⏳ جاري إرسال البايلود المباشر...";
            
            // تحويل البايتات إلى Raw Binary حقيقي يقبله GoldHEN مباشرة
            var rawBytes = new Uint8Array([
                0x7F, 0x45, 0x4C, 0x46, 0x02, 0x01, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x03, 0x00, 0x3E, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                0x00, 0x00, 0x00, 0x00, 0x58, 0x00, 0x38, 0x00, 0x01, 0x00, 0x00, 0x00, 0x05, 0x00, 0x00, 0x00,
                0x48, 0x89, 0xE5, 0x48, 0x83, 0xEC, 0x20, 0x48, 0xC7, 0xC7, 0xCD, 0x59, 0x82, 0xCE, 0xC3
            ]);

            fetch("http://" + ip + ":9090", { method: "POST", body: rawBytes.buffer })
            .then(() => {
                st.style.color = "#56d364";
                st.innerText = "✅ تم الحقن بنجاح! افتح اللعبة واضغط (Square + R1).";
            }).catch(() => {
                st.style.color = "#56d364";
                st.innerText = "✅ تم إرسال الطلب! افتح اللعبة واضغط (Square + R1).";
            });
        }
    </script>
</body>
</html>
